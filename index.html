<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Unlock Video</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
  body {
    margin: 0;
    font-family: -apple-system, sans-serif;
    background: #0f0f14;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  button {
    padding: 14px 28px;
    font-size: 16px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(90deg, #3b82f6, #8b5cf6);
    color: white;
    font-weight: 600;
  }
  #status { margin-top: 16px; color: #aaa; font-size: 14px; }
</style>
</head>
<body>
  <button id="watchBtn">Watch Ad to Unlock</button>
  <div id="status"></div>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();

  const params = new URLSearchParams(location.search);
  const videoId = params.get("video_id");
  const userId = params.get("user_id") || (tg.initDataUnsafe.user && tg.initDataUnsafe.user.id);

  // Replace with your real Adsgram blockId from the Adsgram dashboard.
  const AdController = window.Adsgram.init({ blockId: "49776" });

  const statusEl = document.getElementById("status");
  const btn = document.getElementById("watchBtn");

  btn.onclick = () => {
    statusEl.textContent = "Loading ad...";
    AdController.show()
      .then(() => {
        statusEl.textContent = "Ad complete — unlocking...";
        tg.sendData(JSON.stringify({
          action: "ad_watched",
          video_id: videoId,
          user_id: userId
        }));
        tg.close();
      })
      .catch(() => {
        statusEl.textContent = "Ad was skipped or failed to load. Try again.";
      });
  };
</script>
</body>
</html>
